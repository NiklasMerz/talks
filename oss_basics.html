# Lizenzen

* Typen von Open Source Lizenzen

* Lizenzkompatibilität!

???

* Standards easy to identify
* Proprietär: Closed Source, kommerzielle Lizenzen, Professional things like Fontawesome Pro

.left-column[

  ## Copyleft

  * GPL, AGPL
  * LGPL
  * MPL
  * ....

]
.right-column[

  ## Permissive

  * MIT, ISC
  * Apache 2.0
  * BSD
  * ....

]

???

* Überblick über die gängigsten Lizenztypen
* Permissive: MIT, Apache, BSD -> wenig Einschränkungen
* Copyleft: GPL, AGPL -> Änderungen müssen wieder veröffentlicht werden
* Proprietär: Closed Source, kommerzielle Lizenzen
* Lizenzkompatibilität: Manche Lizenzen schließen sich gegenseitig aus -> z.B. GPL und proprietär
* Wichtig: Lizenz immer lesen und verstehen -> im Zweifel Fragen
