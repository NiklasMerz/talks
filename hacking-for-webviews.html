# What is a WebView?

[W3C WebView Community Group](https://www.w3.org/community/webview/)

> Software components that are used to render Web technology-based content outside of a Web browser (Native Apps, MiniApps, etc).

[User Agent findings from W3C TAG](https://w3ctag.github.io/user-agents/#ua-as-software) 

> As software components, user agents can be parts of larger applications and can call libraries that implement the web
platform or parts of it.

???

* WebView Community Group at W3C
* Long discussion on specifics
* Essentially embedding of web content in native apps

## Loading local files APIs

### Android - WebViewAssetLoader

- Register domains
- https://appassets.androidplatform.net/
- https://mydomain.com
- Intercept GET & path

### iOS - WKURLSchemeHandler

- Register custom URL schemes, e.g. app://
- myapp://appcontent
- Intercept GET & POST

???

* Good example of platform-specific APIs that do the same thing differently
* I spent many hours working finding solutions for problems this caused
* Take inspiration from both for a new Servo API that works for both platforms
