# What is a WebView?

[W3C WebView Community Group](https://www.w3.org/community/webview/)

> Software components that are used to render Web technology-based content outside of a Web browser (Native Apps, MiniApps, etc).

[User Agent finding from W3C TAG](https://www.w3.org/TR/user-agents/) 

> As software components, user agents can be parts of larger applications and can call libraries that implement the web
platform or parts of it.

???

* WebView Community Group at W3C
* Long discussion on specifics
* Essentially embedding of web content in native apps

---

# A Super App is a User Agent

> User agents include both web browsers and other intermediaries between end-users and the web. Each user agent serves its
user, not any of the other constituencies. A user agent owes its user various duties, which are established through
collective discussions and embodied in the various standards that user agents implement.

???

* Mentioned user agent finding by TAG
* Good to remind everyone
* It should follow the duties and serve its users

# WebView Security gone wrong

## Cordova InAppBrowser Plugin

* **Developers build cross-platform apps with Cordova and add plugins**
* InAppBrowser plugin adds a second WebView to a Cordova app
* Built before Custom Tabs & SFSafariViewController
* WebView used for the wrong purpose

???

Great example from Cordova about WebView security

Put web content in apps and call plugins with native features using JS

We know it's not good, stil supported and widely used

---

# Validation gone wrong

## CVE-2026-47430 - CVSS-B 9.5 CRITICAL

The iOS implementation of cordova-plugin-inappbrowser passes the id field from a WKScriptMessage body to commandDelegate
sendPluginResult:callbackId: with no format validation (CDVWKInAppBrowser.m:560–574). Any web content loaded inside the
InAppBrowser can fire any pending Cordova callback in the host app by posting a message whose id field is a guessable or
enumerated callback identifier. An attack abusing this weakness must be tailored to the specific plugins and callback
IDs the host app uses. Though an attacker with knowledge of common Cordova plugin configurations could craft reusable
payloads targeting widely-adopted plugins.

???

* In the code for 7 years
* Validated only on the Android platform

---

# Cordova plugins

* Plugins register callbacks that get ids like InAppBrowser1234567
* Plugin framework uses ids to match between registered JS callbacks and native code
* InAppBrowser registers one callback for its events (loadstart, loadstop, exit, …) plus one per executeScript/insertCSS
call.

---

# Forgotten validation in InAppBrowser

* `window.webkit.messageHandlers.cordova_iab.postMessage` can be executed within a IAB WebView
* Android has some validation to allow only InAppBrowser callbacks not arbitrary ones
* No validation code was added for WKWebView
* Theoretically guessing callback ids of other plugins is possible
* Attackers could gain access to pending callbacks

???

Fun fact Phonegap, Callback, Cordova

Easy fix, easy to forget

**This type of issue could be many applications of WebView**
