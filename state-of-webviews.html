# What is a WebView?

[W3C WebView Community Group](https://www.w3.org/community/webview/)

> Software components that are used to render Web technology-based content outside of a Web browser (Native Apps, MiniApps, etc).

[User Agent finding from W3C TAG](https://w3ctag.github.io/user-agents/#ua-as-software) 

> As software components, user agents can be parts of larger applications and can call libraries that implement the web
platform or parts of it.

???

* WebView Community Group at W3C
* Long discussion on specifics
* Essentially embedding of web content in native apps

# State of WebViews

* Mobile WebViews
  * Android WebView, iOS WKWebView and more
  * **Mini apps**
  * Hybrid: Apache Cordova, Capacitor etc.
* Desktop WebViews
  * Microsoft Edge WebView2
  * macOS WKWebView
  * Linux WebViews (WebKitGTK, QtWebEngine)
  * Hybrid: Electron, Tauri
* ...more embedding of the web

???

* Lots of different WebViews out there
* Very different use cases and capabilities
* Some are for browser like experiences
* Some are for building apps or parts of apps
* **Fragmentation is a big issue**
* **webviews are provided by the OS and just used by apps or frameworks**

---

# Pain points for developers

* Inconsistent support for web features
* Platform-specific APIs that basically do the same thing differently
  * Loading files from the app bundle
  * Cookie handling
  * Permissions

???

* Reason for forming the CG
* **Difference in behavior and support for web features**
* native APIs
* hard to find out support for new features or nuances of the web

# Custom scheme vs Asset handler

### Special Origins

You can't use file:// these days, right?

> https://blog.merzlabs.com/posts/webview-history/

???

* The example I always bring up
* Coming from using a using a framework like React, Angular or Vue with Cordova
* use apis from WebView to load local files

---

### Android - WebViewAssetLoader

- Register domains
- https://appassets.androidplatform.net/
- https://mydomain.com
- Intercept GET & path

### iOS - WKURLSchemeHandler

- Register custom URL schemes, e.g. app://
- myapp://appcontent
- Intercept GET & POST

???

* Good example of platform-specific APIs that do the same thing differently
* I spent many hours working finding solutions for problems this caused
* Boring for most of you, no details

---

# Servo - The new contender

> Servo aims to empower developers with a lightweight, high-performance alternative for embedding web technologies in
applications.

From servo.org

<!--<img src="img/webview/servo-meme.jpg" alt="Servo Meme" style="max-width: 60%; margin: 0 auto; display: block;">-->

???

* Current webviews are based on big engines by OS vendors
* Time to look at alternatives
* servo had a hard start but gaining more traction recently
* **Recently set focus on embedding which makes it perfect for WebViews**

---

# Testing Servo in Apache Cordova

* Servo is easy to add to an Android app!
* ServoView lacks features other WebViews have
    * Custom scheme or asset loader
    * Evaluate JavaScript
    * Cookie store
* First make it work without any Servo modifications
* Then work with Servo team to build a proper integration

???

* Thanks to some funding and guidance from NGI Mobifree fund by NLnet I got to work on bringing Servo to Cordova.
* Android at least
* Cordova back in the day had Crosswalk
* I've started a plugin that shows it works
* Notice quickly where servo lacks support for web features
* Lack of APIs Cordova needs
* plugin bridge and javascript evaluation
* First make it work without any Servo modifications
* continue working with the Servo team
