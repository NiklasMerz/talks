# State of WebViews

* Mobile WebViews
  * Android WebView, iOS WKWebView and more
  * **Mini apps**
  * Hybrid apps: Apache Cordova, Capacitor etc.
* Desktop WebViews
  * Microsoft Edge WebView2
  * macOS WKWebView
  * Linux WebViews (WebKitGTK, QtWebEngine)
  * Electron, Tauri
* ...more embedding of the web

---

# Pain points for developers

* Inconsistent support for web features
* Platform-specific APIs that basically do the same thing differently
  * Loading files -> `file://` vs. custom schemes vs WebViewAssetLoader
  * Cookie handling
  * Permissions
