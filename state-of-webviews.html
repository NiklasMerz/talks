# What is WebView?

Software components that are used to render Web technology-based content outside of a Web browser (Native Apps, MiniApps, etc).

[User Agent finding from W3C TAG](https://w3ctag.github.io/user-agents/#ua-as-software) 

???

* Embedding of web content in native apps
* There is a WebView Community Group at W3C
* Long discussion on specifics

# Why you should care about WebViews

> WebViews are more than just a bridge between native and web—they are a critical component of many digital user
experiences today.

https://blog.merzlabs.com/posts/care-about-webviews/

???

* Easily used without noticing
* Exposed to security risks
* In app browsing
* Mini apps

---

# State of WebViews

* Mobile WebViews
  * Android WebView, iOS WKWebView and more
  * **Mini apps**
  * Hybrid apps: Apache Cordova, Capacitor etc.
* Desktop WebViews
  * Microsoft Edge WebView2
  * macOS WKWebView
  * Linux WebViews (WebKitGTK, QtWebEngine)
  * Electron, Tauri
* ...more embedding of the web

---

# Pain points for developers

* Inconsistent support for web features
* Platform-specific APIs that basically do the same thing differently
  * Loading files -> `file://` vs. custom schemes vs WebViewAssetLoader
  * Cookie handling
  * Permissions

???

Reason for forming the CG

# Custom scheme vs Asset handler

### Special Origins on WebViews

You can't use file:// these days, right?

.columns[
.column[
### Android

WebViewAssetLoader

- Register domains
- https://appassets.androidplatform.net/
- https://mydomain.com
- Intercept GET & path
]
.column[
### iOS

WKURLSchemeHandler

- Register custom URL schemes, e.g. app://
- myapp://appcontent
- Intercept GET & POST
]
]

# Testing Servo in Apache Cordova

* Servo is easy to add to an Android app!
* ServoView lacks features other WebViews have
    * Custom scheme or asset loader
    * Evaluate JavaScript
    * Cookie store
